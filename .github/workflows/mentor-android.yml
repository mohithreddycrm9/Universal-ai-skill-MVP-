name: Mentor Android CI

on:
  push:
    paths:
      - "apps/mentor-android/**"
      - ".github/workflows/mentor-android.yml"
  pull_request:
    paths:
      - "apps/mentor-android/**"
      - ".github/workflows/mentor-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mentor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Paparazzi verify
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/mentor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Require signing secrets
        env:
          MENTOR_RELEASE_KEYSTORE_B64: ${{ secrets.MENTOR_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$MENTOR_RELEASE_KEYSTORE_B64" ]; then
            echo "Missing GitHub secret MENTOR_RELEASE_KEYSTORE_B64 (and related signing secrets)."
            exit 1
          fi
          echo "$MENTOR_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "MENTOR_RELEASE_KEYSTORE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
      - name: Bundle signed release (AAB)
        env:
          MENTOR_KEYSTORE_PASSWORD: ${{ secrets.MENTOR_KEYSTORE_PASSWORD }}
          MENTOR_KEY_ALIAS: ${{ secrets.MENTOR_KEY_ALIAS }}
          MENTOR_KEY_PASSWORD: ${{ secrets.MENTOR_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: universal-ai-release-aab
          path: apps/mentor-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
