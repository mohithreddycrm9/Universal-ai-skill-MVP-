name: Mentor Android CI

on:
  push:
    paths:
      - "apps/mentor-android/**"
      - ".github/workflows/mentor-android.yml"
  pull_request:
    paths:
      - "apps/mentor-android/**"
      - ".github/workflows/mentor-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mentor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Paparazzi verify
        run: ./gradlew :app:verifyPaparazziDebug --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Bundle release (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: universal-ai-release-aab
          path: apps/mentor-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
