name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/github-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify mentor privacy policy (200 text/html)
        run: |
          url="https://mohithreddycrm9.github.io/Universal-ai-skill-MVP-/mentor-privacy-policy.html"
          code=$(curl -fsSL -o /tmp/privacy.html -w "%{http_code}" "$url" || echo "000")
          type=$(curl -fsSL -I "$url" 2>/dev/null | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tr -d '\r' | head -1)
          echo "HTTP $code Content-Type: $type"
          test "$code" = "200"
          echo "$type" | grep -qi 'text/html'
