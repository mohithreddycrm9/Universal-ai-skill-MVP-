# Security gate. Default favors reject/quarantine.

revalidationHours: 168

requiredScanners:
  - secret
  - prompt_injection
  - suspicious_files
  - dependency

optionalScanners:
  - license
  - skillspector
  - semgrep
  - gitleaks

failOnSeverity:
  - CRITICAL
  - HIGH

inconclusiveRequiredIsNotPass: true

# Never auto-approve when a required scanner is missing or errors.
denyApproveOnInconclusive: true
denyApproveOnFail: true

maxFindingEvidenceChars: 480
maxFindingsPerScanner: 50
