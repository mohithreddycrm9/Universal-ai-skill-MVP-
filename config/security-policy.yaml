# Security gate — org-approved default (built-in scanners only).

revalidationHours: 168

# When false (default), gateway registers only built-in static scanners.
extendedScanningEnabled: false

requiredScanners:
  - secret
  - prompt_injection
  - suspicious_files
  - dependency

optionalScanners:
  - license

failOnSeverity:
  - CRITICAL
  - HIGH

inconclusiveRequiredIsNotPass: true
denyApproveOnInconclusive: true
denyApproveOnFail: true

maxFindingEvidenceChars: 480
maxFindingsPerScanner: 50
