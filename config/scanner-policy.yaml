scanners:
  secret:
    enabled: true
  prompt_injection:
    enabled: true
  suspicious_files:
    enabled: true
  dependency:
    enabled: true
    typosquatDistance: 1
  license:
    enabled: true
    allowed:
      - MIT
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - Unlicense
      - 0BSD
  strix:
    enabled: true
    binary: strix
    # If binary/API is absent, status is ERROR/NOT_RUN — never PASS.
    failOpen: false
  semgrep:
    enabled: false
  gitleaks:
    enabled: false
  trivy:
    enabled: false
  clamav:
    enabled: false
  osv:
    enabled: false
  syft:
    enabled: false
  snyk:
    enabled: false
    # Commercial. Never an automatic fallback. Requires cost approval even if enabled.
