scanners:
  secret:
    enabled: true
  prompt_injection:
    enabled: true
  suspicious_files:
    enabled: true
  dependency:
    enabled: true
    typosquatDistance: 1
  license:
    enabled: true
    allowed:
      - MIT
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - Unlicense
      - 0BSD
  strix:
    enabled: true
    binary: strix
    # If binary/API is absent, status is ERROR/NOT_RUN — never PASS.
    failOpen: false
  semgrep:
    enabled: false
    binary: semgrep
    rulesPath: config/semgrep-local.yml
  gitleaks:
    enabled: false
    binary: gitleaks
  trivy:
    enabled: false
    binary: trivy
  clamav:
    enabled: false
    binary: clamscan
  osv:
    enabled: false
    binary: osv-scanner
  syft:
    enabled: false
    binary: syft
  snyk:
    enabled: false
    # Commercial. Never an automatic fallback. Requires cost approval even if enabled.
