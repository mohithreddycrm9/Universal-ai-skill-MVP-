# Cost control — $0 / free-only by default.
# Core remains usable with zero paid services. Paid adapters stay off
# unless you deliberately change this policy (not recommended for $0).

policy: ALLOW_FREE_ONLY
currency: USD
allowUpToAmount: 0
preferFreeAlternatives: true
neverAutoPaidFallback: true

# Even if policy is relaxed later, unknown cost must never be assumed free.
unknownCostRequiresApproval: true
